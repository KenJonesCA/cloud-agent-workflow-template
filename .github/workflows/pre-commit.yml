name: pre-commit

# Pull requests: the gate before a human merges.
# Pushes to main: anything that reaches main without a PR (an admin bypass, an automated
# sync, a direct push before branch protection was set up) gets a red X on the commit that
# introduced the problem, instead of surfacing later on some unrelated PR. It reports; it
# cannot block the push. Branch protection is what blocks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the trailing comment is the human-readable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      # If you switch hooks to the manual stage (docs/setup.md, "CI vs. local hooks"),
      # add --hook-stage manual here.
      - name: Run pre-commit on every file
        run: pre-commit run --all-files --show-diff-on-failure --color=always
